[workspace]
resolver = "2"
members = ["cyw43-controller-proto", "cyw43-controller-blob"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LegitCamper/cyw43-controller"
rust-version = "1.87"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"

[profile.release]
codegen-units = 1
debug = 2
lto = true
opt-level = "s"
